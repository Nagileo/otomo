# 生产覆盖:用 ghcr 上 CI 构建好的镜像,服务器不再本地 build。
# 用法(和基础 compose 叠加):
#   export OTOMO_IMAGE_TAG="$(git rev-parse HEAD)"
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile discord pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile discord up -d
# 或直接跑 bash deploy.sh。
services:
  backend:
    image: ghcr.io/nagileo/otomo-backend:${OTOMO_IMAGE_TAG:?生产部署必须设置 OTOMO_IMAGE_TAG 为当前 commit SHA}
    pull_policy: always
  scheduler:
    image: ghcr.io/nagileo/otomo-backend:${OTOMO_IMAGE_TAG:?生产部署必须设置 OTOMO_IMAGE_TAG 为当前 commit SHA}
    pull_policy: always
  discord:
    image: ghcr.io/nagileo/otomo-backend:${OTOMO_IMAGE_TAG:?生产部署必须设置 OTOMO_IMAGE_TAG 为当前 commit SHA}
    pull_policy: always
  asr:
    image: ghcr.io/nagileo/otomo-backend-asr:${OTOMO_IMAGE_TAG:?ASR 镜像使用的 commit SHA}
    pull_policy: always
  frontend:
    image: ghcr.io/nagileo/otomo-frontend:${OTOMO_IMAGE_TAG:?生产部署必须设置 OTOMO_IMAGE_TAG 为当前 commit SHA}
    pull_policy: always
